<VirtualHost *:80>
    ServerName comernganhmay.online
    ServerAlias www.comernganhmay.online
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:18090/
    ProxyPassReverse / http://127.0.0.1:18090/
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName comernganhmay.online
    ServerAlias www.comernganhmay.online
    SSLEngine On
    SSLCertificateFile /etc/letsencrypt/live/comernganhmay.online/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/comernganhmay.online/privkey.pem
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:18090/
    ProxyPassReverse / http://127.0.0.1:18090/
</VirtualHost>
</IfModule>

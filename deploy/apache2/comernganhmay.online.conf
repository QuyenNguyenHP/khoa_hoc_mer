<VirtualHost *:80>
    ServerName comernganhmay.online
    ServerAlias www.comernganhmay.online

    DocumentRoot /var/www/comernganhmay.online

    <Directory /var/www/comernganhmay.online>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Node/Express API runs locally; Apache exposes it at /api.
    ProxyPreserveHost On
    ProxyPass /api http://127.0.0.1:3002/api
    ProxyPassReverse /api http://127.0.0.1:3002/api

    # Serve the React app for non-file URLs.
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/api/
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^ /index.html [L]

    ErrorLog ${APACHE_LOG_DIR}/comernganhmay.online-error.log
    CustomLog ${APACHE_LOG_DIR}/comernganhmay.online-access.log combined
</VirtualHost>

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    volumes:
      - ./backend/data.json:/app/backend/data.json
      - ./backend/lessons:/app/backend/lessons
      - ./backend/blog.json:/app/backend/blog.json
      - ./backend/site-config.json:/app/backend/site-config.json
      - ./backend/private:/app/backend/private
      - ./backend/blog-images:/app/backend/blog-images
    environment:
      # Key for the Claude blog skill; set it in .env next to this file (git-ignored).
      CONTENT_AGENT_KEY: ${CONTENT_AGENT_KEY:-}
    expose:
      - "3002"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:18090:80"
